---
# tasks file for rollbacksvc

###########################
# 1) 방화벽 포트 제거 - http, https
- name: 1) 방화벽 포트 제거 - http, https
  ansible.posix.firewalld:
    service: "{{ item }}"
    state: disabled
    permanent: true
    immediate: true
  loop: "{{ fw_svcs }}"
  ignore_errors: true

# 2) 서비스 종료 - httpd, firewalld
- name: 2) 서비스 종료 - httpd, firewalld
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ svcs }}"
  ignore_errors: true

# 3) 디렉토리/파일 삭제 - /var/www/html/index.html,...
- name: 3) 디렉토리/파일 삭제 - {{ myfiles }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ myfiles }}"

# 4) 패키지 삭제 - httpd, mod_ssl 
- name: 4) 패키지 삭제 - {{ pkgs }}
  ansible.builtin.dnf:
    name: "{{ pkgs }}"
    state: absent
  ignore_errors: true