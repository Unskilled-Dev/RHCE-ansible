---
#
# Play 01 - 웝서버 설정
#
- name: Play 01 - 웝서버 설정
  hosts: webservers
  tasks:
# 1) 패키지 설치
    - name:  1) 패키지 설치 - httpd firewalld
      ansible.builtin.dnf:
        name: "{{ ansible_local['custom']['general']['package'] }}"
        state: present
# 2) 서비스 기동
    - name: 서비스 기둥
      ansible.builtin.service:
        name: "{{ ansible_local['custom']['general']['package'] }}"
        state: "{{ ansible_local['custom']['general']['state'] }}"
        enabled: true
# 3) 방화벽 설정
    - name: 방화벽 설정
      ansible.posix.firewalld:
        service: "{{ ansible_local['custom']['general']['fwsvc'] }}"
        permanent: true
        immediate: true
        state: enabled
