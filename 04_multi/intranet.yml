---
#############################
# 1. 웹서버 설정 - web1
#  * 2) 패키지 설치
#  * 3) 서비스 설정
#  * 4) 서비스 기동
#  * 5) 방화벽 설정
# 2. 웹 확인 - localhost -> web1
#############################

#
# 1. 웹서버 설정 - web1
#
- name: 1) 웹서버 설정 - web1.example.com
  hosts: webservers
  tasks:
#  * 1) 패키지 설치 - dnf(httpd)
#     # dnf install httpd
    - name: 1) 패키지 설치
      ansible.builtin.dnf:
       name:
        - httpd
        - firewalld
       state: present
#  * 2) 서비스 설정 - copy(/var/www/html/index.html)
#    # scp files/index.html
    - name: 2) 서비스 설정
      ansible.builtin.copy:
       src: files/index.html
       dest: /var/www/html/index.html
       mode: '0644'
#  * 4) 서비스 기동 - systemd_service/service(httpd, firewalld)
#    # systemctl enable httpd
#    # systemctl enable firewalld
    - name: 3) 서비스 기동 - httpd
      ansible.builtin.systemd_service:
       name: httpd
       state: started
       enabled: true

    - name: 4) 서비스 기동 - firewalld
      ansible.builtin.systemd_service:
       name: firewalld
       state: started
       enabled: true
#  * 5) 방화벽 등록 - firewalld(httpd(80/tcp))
#    # firewall-cmd --permanent --add-service=http
#    # firewall-cmd 
    - name: 5) 방화벽 등록 - firewalld
      ansible.posix.firewalld:
       service: http
       state: enabled
       permanent: true
       immediate: true


#
# 2. 웹 확인 - localhost -> web1
#
# * 1) 웹 요청 - http://web1.example.com
#
- name: 2. 웹확인
  hosts: localhost
  become: false
  tasks:
   - name: 1) 웹 요청 - http://web1.example.com
     ansible.builtin.uri:
      url: http://web1.example.com
      return_content: true
     register: html

   - name: 2) 웹 응답
     ansible.builtin.debug:
      var: html.content

