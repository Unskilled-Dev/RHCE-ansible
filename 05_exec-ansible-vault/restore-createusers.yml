---
- name: Delete user accounts for all our servers
  hosts: devservers
  remote_user: devops
  become: true
  vars_files:
    - vars/secret1.yml
    - vars/secret2.yml
    - vars/secret3.yml
  tasks:
    - name: Delete users from sercret.yml
      ansible.builtin.user:
        name: "{{ item.name }}"
        state: absent
        remove: true
      loop: "{{ newusers1 + newusers2 + newusers3 }}"